---
name: CI - pre-commit and tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    name: Run pre-commit and tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Set up SSH agent
      uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Set up Python using pyproject.toml
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        # This tells setup-python to look for the version in pyproject.toml
        python-version-file: 'pyproject.toml'

    - name: Install make
      run: sudo apt-get update && sudo apt-get install -y make

    - name: Install requirements
      run: make install 
    
    - name: Run pre-commit
      run: make lint
    
    - name: Run tests
      run: make test
